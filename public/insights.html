<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Insights | Portfolio Insights</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div data-app-nav></div>

    <main class="page-shell">
      <div class="container">
        <div class="page-heading">
          <h1 class="h2 mb-2">Portfolio Insights</h1>
          <p class="text-secondary mb-0">
            Clarity-first view of scores, risk concentration, scenarios, and the explanation behind each stock signal.
          </p>
        </div>

        <div id="pageFlash" class="d-none mb-4"></div>

        <section class="mb-4">
          <div class="row g-3" id="insightsOverview"></div>
        </section>

        <section class="mb-4">
          <div id="portfolioNarrative"></div>
        </section>

        <section class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Scenarios</h2>
            <span class="text-secondary small">Conservative, moderate, and aggressive outlook</span>
          </div>
          <div class="row g-3" id="scenarioSection"></div>
        </section>

        <section class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Rankings</h2>
            <span class="text-secondary small">Top performers and overexposure review</span>
          </div>
          <div class="row g-3" id="rankingsSection"></div>
        </section>

        <section>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Stock-by-stock explanations</h2>
            <span class="text-secondary small">Source: `/api/portfolio/insights`</span>
          </div>
          <div class="row g-4" id="positionsSection"></div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/assets/app.js"></script>
    <script src="/assets/insights-page.js"></script>
  </body>
</html>
