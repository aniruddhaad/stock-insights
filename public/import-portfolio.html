<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Insights | Import Portfolio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div data-app-nav></div>

    <main class="page-shell">
      <div class="container">
        <div class="page-heading d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-lg-center">
          <div>
            <h1 class="h2 mb-2">Import Portfolio</h1>
            <p class="text-secondary mb-0">Upload a trade CSV and preview normalized transactions before import.</p>
          </div>
          <a class="btn btn-outline-secondary" href="/broker-connections">Broker sync</a>
        </div>

        <div id="pageFlash" class="d-none mb-4"></div>

        <div class="surface-card mb-4">
          <div id="importStatus" class="d-none mb-4"></div>
          <form id="importForm" novalidate>
            <div class="row g-3 align-items-end">
              <div class="col-md-4">
                <label class="form-label" for="provider">CSV format</label>
                <select class="form-select" id="provider" name="provider">
                  <option value="generic">Generic CSV</option>
                  <option value="samco">Samco export</option>
                  <option value="zerodha">Zerodha export</option>
                </select>
              </div>
              <div class="col-md-5">
                <label class="form-label" for="csvFile">CSV file</label>
                <input class="form-control" id="csvFile" name="csvFile" type="file" accept=".csv,text/csv" required />
              </div>
              <div class="col-md-3 d-grid">
                <button class="btn btn-primary" id="previewButton" type="submit">Preview import</button>
              </div>
            </div>
          </form>
        </div>

        <section>
          <div class="d-flex flex-column flex-lg-row justify-content-between gap-2 align-items-lg-center mb-3">
            <h2 class="h4 mb-0">Import preview</h2>
            <button class="btn btn-success d-none" id="commitButton" type="button">Import valid rows</button>
          </div>
          <div id="previewContainer"></div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/assets/app.js"></script>
    <script src="/assets/import-portfolio-page.js"></script>
  </body>
</html>
