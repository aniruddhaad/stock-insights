<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Insights | Add Stock</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div data-app-nav></div>

    <main class="page-shell">
      <div class="container">
        <div class="page-heading">
          <h1 class="h2 mb-2">Add Stock</h1>
          <p class="text-secondary mb-0">Create a new portfolio position using the existing `/api/stocks` endpoint.</p>
        </div>

        <div id="pageFlash" class="d-none mb-4"></div>

        <div class="row justify-content-center">
          <div class="col-xl-8">
            <div class="surface-card">
              <div id="formStatus" class="d-none mb-4"></div>

              <form id="addStockForm" novalidate>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="symbol">Symbol</label>
                    <input
                      class="form-control"
                      id="symbol"
                      name="symbol"
                      type="text"
                      maxlength="15"
                      pattern="[A-Za-z.\-]{1,15}"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="quantity">Quantity</label>
                    <input class="form-control" id="quantity" name="quantity" type="number" min="0.0001" step="0.0001" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="buyPrice">Buy price</label>
                    <input class="form-control" id="buyPrice" name="buyPrice" type="number" min="0.01" step="0.01" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="currentPrice">Current price</label>
                    <input class="form-control" id="currentPrice" name="currentPrice" type="number" min="0.01" step="0.01" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="buyDate">Buy date</label>
                    <input class="form-control" id="buyDate" name="buyDate" type="date" required />
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="note">Note</label>
                    <textarea class="form-control" id="note" name="note" rows="3" placeholder="Optional note about this position"></textarea>
                  </div>
                </div>

                <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
                  <button class="btn btn-primary" type="submit">Save stock</button>
                  <a class="btn btn-outline-secondary" href="/dashboard">Cancel</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/assets/app.js"></script>
    <script src="/assets/add-stock-page.js"></script>
  </body>
</html>
