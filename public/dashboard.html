<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Insights | Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div data-app-nav></div>

    <main class="page-shell">
      <div class="container">
        <div class="page-heading d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-lg-center">
          <div>
            <h1 class="h2 mb-2">Dashboard</h1>
            <p class="text-secondary mb-0">Portfolio summary and stock-level performance snapshot.</p>
          </div>
          <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" href="/insights">View insights</a>
            <a class="btn btn-primary" href="/add-stock">Add stock</a>
          </div>
        </div>

        <div id="pageFlash" class="d-none mb-4"></div>

        <section class="mb-4">
          <div class="row g-3" id="summaryCards"></div>
        </section>

        <section>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Stock list</h2>
            <span class="text-secondary small">Data source: `/api/portfolio/summary`</span>
          </div>
          <div id="holdingsTableContainer"></div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/assets/app.js"></script>
    <script src="/assets/dashboard-page.js"></script>
  </body>
</html>
