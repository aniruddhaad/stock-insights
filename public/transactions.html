<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Insights | Transactions</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div data-app-nav></div>

    <main class="page-shell">
      <div class="container">
        <div class="page-heading d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-lg-center">
          <div>
            <h1 class="h2 mb-2">Transactions</h1>
            <p class="text-secondary mb-0">Buy and sell activity that derives portfolio holdings.</p>
          </div>
          <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" href="/dashboard">Dashboard</a>
            <button class="btn btn-primary" type="button" id="addTransactionButton">Add transaction</button>
          </div>
        </div>

        <div id="pageFlash" class="d-none mb-4"></div>

        <section class="mb-3 d-flex flex-column flex-lg-row gap-2 align-items-lg-center justify-content-between">
          <div class="input-group" style="max-width: 360px">
            <span class="input-group-text">Symbol</span>
            <input class="form-control" id="symbolFilter" placeholder="All" />
            <button class="btn btn-outline-secondary" id="applyFilterButton" type="button">Apply</button>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="includeInactiveCheckbox" />
            <label class="form-check-label" for="includeInactiveCheckbox">Include inactive imports</label>
          </div>
        </section>

        <section id="transactionsContainer"></section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/assets/app.js"></script>
    <script src="/assets/transactions-page.js"></script>
  </body>
</html>
