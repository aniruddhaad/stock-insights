<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Insights | Broker Connections</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div data-app-nav></div>

    <main class="page-shell">
      <div class="container">
        <div class="page-heading d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-lg-center">
          <div>
            <h1 class="h2 mb-2">Broker Connections</h1>
            <p class="text-secondary mb-0">Connect Samco or Zerodha and sync transaction history into the portfolio.</p>
          </div>
          <a class="btn btn-outline-secondary" href="/import-portfolio">CSV import</a>
        </div>

        <div id="pageFlash" class="d-none mb-4"></div>

        <div class="row g-4">
          <div class="col-lg-5">
            <div class="surface-card">
              <h2 class="h5 mb-3">Connect broker</h2>
              <div id="brokerStatus" class="d-none mb-4"></div>
              <form id="brokerForm" novalidate>
                <div class="mb-3">
                  <label class="form-label" for="broker">Broker</label>
                  <select class="form-select" id="broker" name="broker">
                    <option value="samco">Samco</option>
                    <option value="zerodha">Zerodha</option>
                  </select>
                </div>
                <div id="brokerFields"></div>
                <button class="btn btn-primary w-100" id="connectButton" type="submit">Connect broker</button>
              </form>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h4 mb-0">Sync status</h2>
              <button class="btn btn-outline-primary" id="refreshButton" type="button">Refresh</button>
            </div>
            <div id="connectionsContainer"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/assets/app.js"></script>
    <script src="/assets/broker-connections-page.js"></script>
  </body>
</html>
