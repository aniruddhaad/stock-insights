<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Insights | Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="auth-shell">
      <div class="container">
        <div class="row g-4 align-items-center">
          <div class="col-lg-5">
            <div class="pe-lg-4">
              <p class="text-uppercase text-primary fw-semibold small mb-3">Portfolio tracking</p>
              <h1 class="auth-title mb-3">Simple access to your stock portfolio and insights.</h1>
              <p class="auth-subtitle mb-0">
                Authenticate once, then use the dashboard, add stock workflow, and the portfolio
                insights page against the existing backend APIs.
              </p>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="auth-card">
              <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
                <div>
                  <h2 class="h3 mb-1">Account access</h2>
                  <p class="text-secondary mb-0">Use login for existing accounts or create a new one.</p>
                </div>
                <div class="auth-mode-toggle btn-group" role="group" aria-label="Authentication mode">
                  <button class="btn btn-primary" id="loginTab" type="button">Login</button>
                  <button class="btn btn-outline-primary" id="signupTab" type="button">Signup</button>
                </div>
              </div>

              <div id="authStatus" class="d-none mb-4"></div>

              <section id="loginPanel">
                <form id="loginForm" novalidate>
                  <div class="mb-3">
                    <label class="form-label" for="loginEmail">Email</label>
                    <input class="form-control" id="loginEmail" name="email" type="email" required />
                  </div>
                  <div class="mb-4">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input class="form-control" id="loginPassword" name="password" type="password" required />
                  </div>
                  <button class="btn btn-primary w-100" type="submit">Login</button>
                </form>
              </section>

              <section id="signupPanel" class="d-none">
                <form id="signupForm" novalidate>
                  <div class="mb-3">
                    <label class="form-label" for="signupName">Name</label>
                    <input class="form-control" id="signupName" name="name" type="text" minlength="2" required />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="signupEmail">Email</label>
                    <input class="form-control" id="signupEmail" name="email" type="email" required />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="signupPassword">Password</label>
                    <input
                      class="form-control"
                      id="signupPassword"
                      name="password"
                      type="password"
                      minlength="8"
                      required
                    />
                  </div>
                  <div class="mb-4">
                    <label class="form-label" for="signupPasswordConfirm">Confirm password</label>
                    <input
                      class="form-control"
                      id="signupPasswordConfirm"
                      name="passwordConfirm"
                      type="password"
                      minlength="8"
                      required
                    />
                  </div>
                  <button class="btn btn-primary w-100" type="submit">Create account</button>
                </form>
              </section>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/assets/app.js"></script>
    <script src="/assets/auth-page.js"></script>
  </body>
</html>
